services:
  postgres:
    image: postgres:16-alpine
    container_name: repositorio-postgres
    environment:
      POSTGRES_DB: usuarios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usuarios"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: repositorio-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: repositorio-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      DatabaseSettings__ConnectionString: "Host=postgres;Port=5432;Database=usuarios;Username=postgres;Password=postgres"
      CacheSettings__RedisConnectionString: "redis:6379,allowAdmin=true"
    stdin_open: true
    tty: true

volumes:
  postgres_data:
